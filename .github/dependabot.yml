# Dependency-update posture for this repository.
#
# VERSION UPDATES ARE OFF. `open-pull-requests-limit: 0` is GitHub's documented
# mechanism for disabling them ("You can temporarily disable version updates for
# a package manager by setting this option to zero"). The entry names `gomod`
# because that is this repository's primary manifest — it is the ecosystem that
# would be used if updates were turned on, not a stream that is running.
#
# WHY OFF. This client is in maintenance mode and scheduled for sunset after
# Olympia; v1.13.x is the final stable series. A standing weekly pull-request
# queue is version *currency*, which is a maintenance preference — and it is only
# worth its cost where someone will triage the queue. Nobody will here.
#
# WHAT IS ACTUALLY IN FORCE INSTEAD. Go's own toolchain is the control:
# `go list -m -u all` surfaces module retractions, and `govulncheck` reports
# known advisories against the resolved versions. Neither depends on this file.
# Note that a retraction is usually maintainer hygiene rather than a security
# signal, and is not evidence of exposure on its own.
#
# THIS FILE DOES NOT CONTROL SECURITY UPDATES, and a zero limit does not switch
# them off — they are a repository setting with no key in this file at all, and
# their pull requests are not subject to this limit. Measured directly against
# the GitHub API on 2026-08-21:
#
#   repos/white-b0x/core-geth/automated-security-fixes -> {"enabled":false,"paused":false}
#   repos/white-b0x/core-geth/vulnerability-alerts     -> HTTP 404 (not enabled)
#
# So both are OFF at the repository level, and this repository is quiet because
# of that setting — NOT because of the limit below. Re-check the API rather than
# trusting this comment: anyone with admin access can flip either, and doing so
# would start delivering security pull requests into a repository a reader of
# this file has taken to be closed.
#
# TO ENABLE VERSION UPDATES: raise the limit and add a `cooldown:` block at the
# same time (values are house policy, not this file's to state). A cooldown is
# deliberately absent while the limit is zero, because it would gate nothing and
# an inert setting reads as a control that is operating.
version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
